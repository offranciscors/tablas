<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de tablas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <h1>Práctica de tablas en HTML</h1>
        <a href="horario.html">Ver Horario</a>
        <section>
            <table border="1">
                <tr>
                    <th>Aprendiz</th>
                    <th>Nota</th>
                </tr>
                <tr>
                    <td>Ana</td>
                    <td>4.5</td>
                </tr>
                <tr>
                    <td>Carlos</td>
                    <td>3.8</td>
                </tr>
            </table>
        </section>

        <section>
            <table border="1">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precios</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Teclado</td><td>$85.000</td></tr>
                    <tr><td>Mouse</td><td>$40.000</td></tr>
                </tbody>
                <tfoot>
                    <tr><td>Total</td><td>$125.000</td></tr>
                </tfoot>
            </table>
        </section>

        <section>
            <table border="1">
                <caption>Notas del primer trimestre</caption>
                <thead>
                    <tr><th>Aprendiz</th><th>Nota</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ana</td><td>4.5</td></tr>
                </tbody>
            </table>
        </section>

        <section>
            <table border="1">
                <tr>
                    <th colspan="2">Datos personales</th>
                    <th>Ficha</th>
                </tr>
                <tr>
                    <td>Ana</td>
                    <td>Gómez</td>
                    <td>2875432</td>
                </tr>
            </table>
        </section>

        <section>
            <table border="1">
                <tr>
                    <th rowspan="2">Lunes</th>
                    <td>7:00 a.m.</td>
                    <td>HTML</td>
                </tr>
                <tr>
                    <td>9:00 a.m.</td>
                    <td>CSS</td>
                </tr>
            </table>
        </section>

        <section>
            <table border="1">
                <thead>
                    <tr>
                        <th scope="col">Aprendiz</th>
                        <th scope="col">Nota</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Ana</th>
                        <td>4.5</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <div class="tabla-contenedor">
            <table>... </table>
            </div>
        </section>
    </main>
</body>
</html>
